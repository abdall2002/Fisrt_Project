<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

<body>
     <h1>booking form</h1>
    <form action="" method="post">
        <table>
            <tr class="one">

                <td>name</td>
                <td><input type="text" placeholder="enter your name" required/></td>
            </tr>
            <tr class="two">
                <td>email</td>
                <td><input type="email" placeholder="enter your email" required/></td>
            </tr>
            <tr class="three">
                <td>phone</td>
                <td><input type="number" placeholder="your number" required/></td>
            </tr>
            <tr class="four">
                <td>arrival date</td>
                <td><input type="date" required/></td>
            </tr>
            <tr class="five">
                <td>deputure date</td>
                <td><input type="date" required/></td>
            </tr>
        </table>
        <div class="zzz">
            <label for="">room type</label>
            <select>
                <option value="">--select room--</option>
                <option value="">single room</option>
                <option value=""> double room </option>
                <option value=""> suite room</option>
            </select>
        </div>
        <div class="zzzz">
            <fieldset>
                <legend>servies</legend>
                <label for="">breakfast<input type="checkbox"></label>
                <label for="">wifi<input type="checkbox"></label>
            </fieldset>
             <fieldset>
                <legend>payment</legend>
                <label for="">cash<input type="radio"></label>
                <label for="">card<input type="radio"></label>
            </fieldset>
        </div>
        <div class="zzzzz">
            <label for="">uploud id </label>
            <input type="file">
        </div>
        <div class="zzzzzz">
            <label for="">notes</label>
            <textarea ></textarea>
        </div>
        <div class="zeyad">
            <button type="submit">book</button>
        </div>
    
      <footer>devoloped by zeyad aboelsood</footer>

    </form>

</body>
